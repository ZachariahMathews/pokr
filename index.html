      // -------------------------------------------------------------------
      // CONFETTI ANIMATION (Thrown from bottom middle of screen)
      // -------------------------------------------------------------------
      let confettiRafId = null;

      function launchBottomMiddleConfetti() {
        const canvas = el.confettiCanvas;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        if (confettiRafId) {
          cancelAnimationFrame(confettiRafId);
          confettiRafId = null;
        }

        const dpr = window.devicePixelRatio || 1;
        const width = window.innerWidth;
        const height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        ctx.scale(dpr, dpr);

        canvas.classList.remove('hidden');

        const palette = ['#0074bd', '#005f9e', '#8bd3e6', '#00818f', '#f46b10', '#fdb515'];
        const count = 110;
        const originX = width / 2;
        const originY = height + 10;

        const particles = Array.from({ length: count }, () => {
          // Throw upward in a fan from bottom-center (-90 deg is straight up)
          const spreadRad = (Math.random() - 0.5) * 1.15; // ~65 deg cone
          const angle = -Math.PI / 2 + spreadRad;
          const speed = 14 + Math.random() * 14;
          return {
            x: originX + (Math.random() - 0.5) * 40,
            y: originY,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            w: 7 + Math.random() * 6,
            h: 4 + Math.random() * 5,
            color: palette[Math.floor(Math.random() * palette.length)],
            rotation: Math.random() * Math.PI * 2,
            rotationSpeed: (Math.random() - 0.5) * 0.22,
            tilt: Math.random() * Math.PI * 2,
            tiltSpeed: 0.08 + Math.random() * 0.14,
            alpha: 1,
            decay: 0.008 + Math.random() * 0.008
          };
        });

        const gravity = 0.36;
        const drag = 0.985;

        function tick() {
          ctx.clearRect(0, 0, width, height);
          let alive = 0;

          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            if (p.alpha <= 0) continue;

            p.vx *= drag;
            p.vy = p.vy * drag + gravity;
            p.x += p.vx;
            p.y += p.vy;
            p.rotation += p.rotationSpeed;
            p.tilt += p.tiltSpeed;

            // Start fading once velocity turns downward or after peak
            if (p.vy > -1) {
              p.alpha -= p.decay;
            }

            if (p.alpha > 0 && p.y < height + 40) {
              alive++;
              ctx.save();
              ctx.globalAlpha = Math.max(0, p.alpha);
              ctx.translate(p.x, p.y);
              ctx.rotate(p.rotation);
              ctx.scale(1, Math.cos(p.tilt));
              ctx.fillStyle = p.color;
              ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
              ctx.restore();
            } else {
              p.alpha = 0;
            }
          }

          if (alive > 0) {
            confettiRafId = requestAnimationFrame(tick);
          } else {
            ctx.clearRect(0, 0, width, height);
            canvas.classList.add('hidden');
            confettiRafId = null;
          }
        }

        confettiRafId = requestAnimationFrame(tick);
      }

      // -------------------------------------------------------------------
      // 4. CRYPTOGRAPHIC COMMIT-REVEAL (Section 3.4)
      // -------------------------------------------------------------------
      function generateSaltHex() {
        const bytes = new Uint8Array(8);
        crypto.getRandomValues(bytes);
        return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
      }

      async function computeCommitHash(value, salt) {
        const input = `${value}:${salt}`;
        const encoded = new TextEncoder().encode(input);
        const digestBuffer = await crypto.subtle.digest('SHA-256', encoded);
        const hashBytes = new Uint8Array(digestBuffer);
        return Array.from(hashBytes, b => b.toString(16).padStart(2, '0')).join('');
      }

      // -------------------------------------------------------------------
      // 5. HELPERS & SESSION STORAGE
      // -------------------------------------------------------------------
      function sanitizeRoomName(raw) {
        return String(raw || '')
          .trim()
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-+|-+$/g, '')
          .slice(0, 40);
      }

      // Ensures ID strictly conforms to PeerJS validateId (/^[A-Za-z0-9]+(?:[ _-][A-Za-z0-9]+)*$/)
      function toValidPeerId(raw) {
        return String(raw || '')
          .replace(/[^A-Za-z0-9_-]+/g, '-')
          .replace(/[_-]{2,}/g, '_')
          .replace(/^[_-]+|[_-]+$/g, '');
      }

      function generateRandomSlug() {
        const words = ['core', 'mercury', 'atlas', 'nova', 'apex', 'vector', 'pulse', 'nimbus'];
        const pick = words[Math.floor(Math.random() * words.length)];
        const num = Math.floor(10 + Math.random() * 89);
        return `${pick}-sprint-${num}`;
      }

      function saveRoomState() {
        if (!state.roomName) return;
        try {
          const participants = [];
          state.peers.forEach((p, id) => {
            if (id && id !== state.myPeerId) {
              participants.push({
                peerId: id,
                name: p.name || 'Peer',
                isHost: Boolean(p.isHost),
                isObserver: Boolean(p.isObserver),
                commitHash: p.commitHash || null,
                revealedVote: p.revealedVote ?? null,
                revealedSalt: p.revealedSalt || null,
                verified: p.verified ?? null,
                joinedAt: p.joinedAt || Date.now()
              });
            }
          });

          const roomPayload = {
            onboarded: state.isOnboarded,
            myName: state.myName,
            myIsObserver: state.myIsObserver,
            wasLead: Boolean(state.myPeerId && state.hostPeerId === state.myPeerId),
            hostPeerId: state.hostPeerId,
            isRevealed: state.isRevealed,
            joinedAt: state.joinedAt,
            myVote: state.myVote,
            mySalt: state.mySalt,
            myCommitHash: state.myCommitHash,
            participants,
            updatedAt: Date.now()
          };

          const serialized = JSON.stringify(roomPayload);
          localStorage.setItem(STORAGE_KEYS.ROOM_PREFIX + state.roomName, serialized);
          sessionStorage.setItem(STORAGE_KEYS.SESSION_PREFIX + state.roomName, serialized);
        } catch (_) {}
      }

      function loadRoomState(roomName) {
        if (!roomName) return null;
        try {
          const rawSession = sessionStorage.getItem(STORAGE_KEYS.SESSION_PREFIX + roomName);
          const rawLocal = localStorage.getItem(STORAGE_KEYS.ROOM_PREFIX + roomName);
          const localData = rawLocal ? JSON.parse(rawLocal) : null;
          const sessionData = rawSession ? JSON.parse(rawSession) : null;
          if (!localData && !sessionData) return null;
          return {
            ...(localData || {}),
            ...(sessionData || {}),
            participants: (localData && Array.isArray(localData.participants))
              ? localData.participants
              : (sessionData && Array.isArray(sessionData.participants) ? sessionData.participants : [])
          };
        } catch (_) {
          return null;
        }
      }

      function normalizeFibValue(val) {
        if (val === '?' || val === '☕') return val;
        if (val === null || val === undefined || val === '') return null;
        const num = Number(val);
        if (!Number.isNaN(num) && FIB_DECK.includes(num)) return num;
        return null;
      }

      function escapeHtml(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // -------------------------------------------------------------------
      // 6. THEME
      // -------------------------------------------------------------------
      function initTheme() {
        const saved = localStorage.getItem(STORAGE_KEYS.THEME);
        if (saved === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      }

      function toggleTheme() {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem(STORAGE_KEYS.THEME, isDark ? 'dark' : 'light');
      }

      // -------------------------------------------------------------------
      // 7. STATE & MESH TRANSPORT (Sections 4 & 5)
      // -------------------------------------------------------------------
      function getLeadPeerId(room = state.roomName) {
        return toValidPeerId(`${room}__lead`);
      }

      function generateMemberPeerId(room = state.roomName) {
        const uuidSlice = (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function')
          ? crypto.randomUUID().replace(/-/g, '').slice(0, 8)
          : Math.random().toString(36).substring(2, 10);
        return toValidPeerId(`${room}__member_${uuidSlice}`);
      }

      function updateSelfInPeersMap() {
        if (!state.myPeerId) return;
        const existing = state.peers.get(state.myPeerId) || {};
        state.peers.set(state.myPeerId, {
          ...existing,
          peerId: state.myPeerId,
          name: state.myName || 'Anonymous',
          isHost: state.hostPeerId === state.myPeerId,
          isObserver: state.myIsObserver,
          commitHash: state.myCommitHash,
          revealedVote: state.isRevealed ? state.myVote : null,
          revealedSalt: state.isRevealed ? state.mySalt : null,
          verified: state.isRevealed && state.myVote !== null ? true : null,
          joinedAt: state.joinedAt,
          connected: true,
          isSelf: true
        });
      }

      function buildSyncMeMessage() {
        return {
          type: 'SYNC_ME',
          payload: {
            peerId: state.myPeerId,
            name: state.myName || 'Anonymous',
            isHost: state.hostPeerId === state.myPeerId,
            isObserver: state.myIsObserver,
            commitHash: state.myCommitHash,
            revealedVote: state.isRevealed ? state.myVote : null,
            revealedSalt: state.isRevealed ? state.mySalt : null,
            isRevealed: state.isRevealed,
            joinedAt: state.joinedAt
          }
        };
      }

      function buildSyncRoomStateMessage() {
        const committedPeers = [];
        state.peers.forEach((p, id) => {
          if (p.commitHash) committedPeers.push(id);
        });
        return {
          type: 'SYNC_ROOM_STATE',
          payload: {
            hostPeerId: state.hostPeerId,
            isRevealed: state.isRevealed,
            committedPeers
          }
        };
      }

      function broadcastToMesh(message) {
        state.dataChannels.forEach((conn) => {
          if (conn && conn.open) {
            try {
              conn.send(message);
            } catch (_) {}
          }
        });
      }

      function sendToPeer(peerId, message) {
        if (!peerId || peerId === state.myPeerId) return;
        const conn = state.dataChannels.get(peerId);
        if (!conn) return;
        if (conn.open) {
          try {
            conn.send(message);
          } catch (_) {}
        } else if (typeof conn.once === 'function') {
          conn.once('open', () => {
            try {
              conn.send(message);
            } catch (_) {}
          });
        }
      }

      // -------------------------------------------------------------------
      // 8. ENTERPRISE-SAFE DISCOVERY & MESH ASSEMBLY VIA PEERJS (Section 4)
      // -------------------------------------------------------------------
      function clearLeadProbeTimers() {
        if (state.leadProbeTimeout) {
          clearTimeout(state.leadProbeTimeout);
          state.leadProbeTimeout = null;
        }
        if (state.leadPollTimer) {
          clearInterval(state.leadPollTimer);
          state.leadPollTimer = null;
        }
      }

      function ensureLeadPolling() {
        if (!state.roomName || state.hostPeerId) return;
        if (state.leadPollTimer) return;
        state.leadPollTimer = setInterval(() => {
          if (state.hostPeerId && state.peers.has(state.hostPeerId)) {
            clearLeadProbeTimers();
            state.isWaitingForLead = false;
            renderRoomUI();
            return;
          }
          probeLeadConnection(true);
        }, 2000);
      }

      function ensurePeerEntry(peerId, name) {
        if (!peerId || peerId === state.myPeerId) return null;
        const existing = state.peers.get(peerId);
        if (existing) {
          if (name && (!existing.name || existing.name === 'Peer')) {
            existing.name = name;
          }
          return existing;
        }
        const entry = {
          peerId,
          name: name || 'Peer',
          isHost: state.hostPeerId === peerId,
          isObserver: false,
          commitHash: null,
          revealedVote: null,
          revealedSalt: null,
          verified: null,
          joinedAt: Date.now(),
          connected: false,
          isSelf: false
        };
        state.peers.set(peerId, entry);
        return entry;
      }

      // Section 4.3 Step 3: Mesh Interconnection with strict tie-breaker (myPeerId > targetPeerId)
      function connectToPeerWithTieBreaker(targetPeerId, targetName, forceConnect = false) {
        if (!targetPeerId || targetPeerId === state.myPeerId) return;
        ensurePeerEntry(targetPeerId, targetName);

        const existingConn = state.dataChannels.get(targetPeerId);
        if (existingConn) {
          if (existingConn.open) return;
          const ageMs = Date.now() - (existingConn._createdAt || 0);
          if (ageMs < 8000) return;
          try { existingConn.close(); } catch (_) {}
          state.dataChannels.delete(targetPeerId);
        }

        const shouldDial = forceConnect || (state.myPeerId > targetPeerId);
        if (shouldDial && state.peerInstance && !state.peerInstance.destroyed && state.peerInstance.open) {
          try {
            const conn = state.peerInstance.connect(targetPeerId, {
              reliable: true,
              serialization: 'json'
            });
            registerDataChannel(conn, false);
          } catch (_) {}
        }
      }

      // Section 4.3 Step 1: Initial Connection Probe to LEAD_PEER_ID
      function probeLeadConnection(isBackgroundPoll = false) {
        if (!state.roomName) return;
        const leadId = getLeadPeerId();
        if (state.myPeerId === leadId) return;
        if (state.hostPeerId && state.peers.has(state.hostPeerId)) return;

        const existingLeadConn = state.dataChannels.get(leadId);
        if (existingLeadConn) {
          if (existingLeadConn.open) return;
          const ageMs = Date.now() - (existingLeadConn._createdAt || 0);
          if (ageMs < 8000) return;
          try { existingLeadConn.close(); } catch (_) {}
          state.dataChannels.delete(leadId);
        }

        if (state.leadProbeTimeout) {
          clearTimeout(state.leadProbeTimeout);
          state.leadProbeTimeout = null;
        }

        if (!isBackgroundPoll) {
          state.isProbingLead = true;
          renderRoomUI();
        }

        if (state.peerInstance && !state.peerInstance.destroyed && state.peerInstance.open) {
          try {
            const conn = state.peerInstance.connect(leadId, {
              reliable: true,
              serialization: 'json'
            });
            registerDataChannel(conn, true);
          } catch (_) {}
        }

        state.leadProbeTimeout = setTimeout(() => {
          const activeConn = state.dataChannels.get(leadId);
          if ((!activeConn || !activeConn.open) && !state.hostPeerId) {
            state.isProbingLead = false;
            ensureLeadPolling();
            renderRoomUI();
          }
        }, 2500);
      }

      // Prompt Choice 1: Claim 👑 -> Re-initialize PeerJS binding explicitly to LEAD_PEER_ID
      function claimLeadByBinding() {
        if (!state.roomName) return;
        const leadId = getLeadPeerId();

        // If already bound as LEAD_PEER_ID, just claim host state
        if (state.myPeerId === leadId) {
          assignHostRole(leadId);
          return;
        }

        // Preserve known peers before re-binding to LEAD_PEER_ID
        const knownRemotePeers = [];
        state.peers.forEach((p, id) => {
          if (id !== state.myPeerId) {
            knownRemotePeers.push({ id, name: p.name });
          }
        });

        const oldPeerId = state.myPeerId;
        clearLeadProbeTimers();
        state.isProbingLead = false;
        state.isWaitingForLead = false;

        if (oldPeerId) {
          broadcastToMesh({
            type: 'PEER_LEAVING',
            payload: { peerId: oldPeerId }
          });
        }

        state.dataChannels.forEach((conn) => {
          try { conn.close(); } catch (_) {}
        });
        state.dataChannels.clear();

        if (state.peerInstance) {
          try { state.peerInstance.destroy(); } catch (_) {}
          state.peerInstance = null;
        }

        if (oldPeerId) {
          state.peers.delete(oldPeerId);
        }
        state.myPeerId = leadId;
        state.hostPeerId = leadId;
        updateSelfInPeersMap();
        saveRoomState();
        renderRoomUI();

        initPeerInstance(leadId, true, knownRemotePeers);
      }

      // Prompt Choice 2: Wait -> Retries polling LEAD_PEER_ID at 2-second intervals
      function startWaitingForLead() {
        if (!state.roomName || state.hostPeerId) return;
        state.isWaitingForLead = true;
        state.isProbingLead = false;
        renderRoomUI();

        probeLeadConnection(true);
        ensureLeadPolling();
      }

      function registerDataChannel(conn, isLeadProbe = false) {
        if (!conn || !conn.peer) return;
        const remotePeerId = conn.peer;
        conn._createdAt = Date.now();

        state.dataChannels.set(remotePeerId, conn);

        conn.on('open', () => {
          state.dataChannels.set(remotePeerId, conn);

          if (remotePeerId === getLeadPeerId()) {
            clearLeadProbeTimers();
            state.isProbingLead = false;
            state.isWaitingForLead = false;
            if (!state.hostPeerId) {
              state.hostPeerId = remotePeerId;
            }
          }

          const p = ensurePeerEntry(remotePeerId, 'Peer');
          if (p) {
            p.connected = true;
            p.isHost = (state.hostPeerId === remotePeerId);
            state.peers.set(remotePeerId, p);
          }

          // Section 4.3 Step 1: Transmit JOIN_REQUEST when connecting to Lead
          if (isLeadProbe || remotePeerId === getLeadPeerId()) {
            conn.send({
              type: 'JOIN_REQUEST',
              payload: {
                peerId: state.myPeerId,
                name: state.myName || 'Anonymous'
              }
            });
          }

          // Exchange state hydration on DataChannel open
          conn.send(buildSyncRoomStateMessage());
          conn.send(buildSyncMeMessage());

          if (state.isRevealed && state.myVote !== null && state.mySalt) {
            conn.send({
              type: 'VOTE_REVEALED',
              payload: {
                peerId: state.myPeerId,
                value: state.myVote,
                salt: state.mySalt
              }
            });
          }

          saveRoomState();
          renderRoomUI();
        });

        conn.on('data', (msg) => {
          handleIncomingMeshMessage(remotePeerId, msg);
        });

        conn.on('close', () => {
          if (state.dataChannels.get(remotePeerId) === conn) {
            state.dataChannels.delete(remotePeerId);
            handlePeerLeft(remotePeerId);
          }
        });

        conn.on('error', () => {
          if (state.dataChannels.get(remotePeerId) === conn) {
            state.dataChannels.delete(remotePeerId);
            handlePeerLeft(remotePeerId);
          }
        });
      }

      function handlePeerLeft(remotePeerId) {
        if (!remotePeerId || remotePeerId === state.myPeerId) return;
        state.peers.delete(remotePeerId);
        state.dataChannels.delete(remotePeerId);

        if (state.hostPeerId === remotePeerId) {
          state.hostPeerId = null;
          ensureLeadPolling();
        }
        updateSelfInPeersMap();
        saveRoomState();
        renderRoomUI();
      }

      // -------------------------------------------------------------------
      // 9. MESSAGE PROTOCOL HANDLER (Sections 4.3, 4.4 & 5.2)
      // -------------------------------------------------------------------
      async function handleIncomingMeshMessage(senderPeerId, msg) {
        if (!msg || typeof msg !== 'object') return;

        switch (msg.type) {
          // Section 4.3 Step 2: Lead receives JOIN_REQUEST, replies with ROSTER_SYNC, and broadcasts PEER_ANNOUNCE
          case 'JOIN_REQUEST': {
            const payload = msg.payload || {};
            const joinerId = payload.peerId || senderPeerId;
            const joinerName = payload.name || 'Peer';
            if (!joinerId || joinerId === state.myPeerId) return;

            const existing = ensurePeerEntry(joinerId, joinerName);
            if (existing) {
              existing.name = joinerName;
              existing.connected = true;
              state.peers.set(joinerId, existing);
            }

            const rosterPeers = [];
            const committedPeers = [];
            state.peers.forEach((p, id) => {
              if (p.commitHash) committedPeers.push(id);
              if (id !== joinerId) {
                rosterPeers.push({
                  id,
                  name: p.name || 'Peer'
                });
              }
            });

            // 1. Reply directly to the new joiner with ROSTER_SYNC
            sendToPeer(joinerId, {
              type: 'ROSTER_SYNC',
              payload: {
                peers: rosterPeers,
                hostPeerId: state.hostPeerId || state.myPeerId,
                isRevealed: state.isRevealed,
                committedPeers
              }
            });
            sendToPeer(joinerId, buildSyncRoomStateMessage());
            sendToPeer(joinerId, buildSyncMeMessage());

            // 2. Broadcast PEER_ANNOUNCE to all other currently connected members
            const announceMsg = {
              type: 'PEER_ANNOUNCE',
              payload: {
                id: joinerId,
                name: joinerName
              }
            };
            state.dataChannels.forEach((conn, peerId) => {
              if (peerId !== joinerId && conn && conn.open) {
                try {
                  conn.send(announceMsg);
                } catch (_) {}
              }
            });

            saveRoomState();
            renderRoomUI();
            break;
          }

          // Section 4.3 Step 2 & 3: Joiner receives ROSTER_SYNC and connects to listed peers via tie-breaker
          case 'ROSTER_SYNC': {
            const { peers, hostPeerId, isRevealed, committedPeers } = msg.payload || {};

            clearLeadProbeTimers();
            state.isProbingLead = false;
            state.isWaitingForLead = false;

            if (hostPeerId) {
              state.hostPeerId = hostPeerId;
            } else if (!state.hostPeerId) {
              state.hostPeerId = senderPeerId;
            }

            if (Array.isArray(peers)) {
              peers.forEach((peerInfo) => {
                const pid = peerInfo && (peerInfo.id || peerInfo.peerId);
                const pname = (peerInfo && peerInfo.name) || 'Peer';
                if (pid && pid !== state.myPeerId) {
                  ensurePeerEntry(pid, pname);
                  if (pid !== senderPeerId) {
                    connectToPeerWithTieBreaker(pid, pname);
                  }
                }
              });
            }

            if (Array.isArray(committedPeers)) {
              committedPeers.forEach((cid) => {
                if (cid && cid !== state.myPeerId) {
                  const cp = ensurePeerEntry(cid);
                  if (cp && !cp.commitHash) cp.commitHash = 'committed';
                }
              });
            }

            if (isRevealed && !state.isRevealed) {
              state.isRevealed = true;
              if (state.myVote !== null && state.mySalt) {
                broadcastToMesh({
                  type: 'VOTE_REVEALED',
                  payload: {
                    peerId: state.myPeerId,
                    value: state.myVote,
                    salt: state.mySalt
                  }
                });
              }
            }

            updateSelfInPeersMap();
            saveRoomState();
            sendToPeer(senderPeerId, buildSyncMeMessage());
            renderRoomUI();
            break;
          }

          // Section 4.3 Step 2 & 3: Existing member receives PEER_ANNOUNCE and connects via tie-breaker
          case 'PEER_ANNOUNCE': {
            const payload = msg.payload || {};
            const newPeerId = payload.id || payload.newPeerId || payload.peerId;
            const newPeerName = payload.name || 'Peer';
            if (!newPeerId || newPeerId === state.myPeerId) return;

            ensurePeerEntry(newPeerId, newPeerName);
            connectToPeerWithTieBreaker(newPeerId, newPeerName);
            saveRoomState();
            renderRoomUI();
            break;
          }

          case 'SYNC_ROOM_STATE': {
            const { hostPeerId, isRevealed, committedPeers } = msg.payload || {};
            if (hostPeerId && !state.hostPeerId) {
              state.hostPeerId = hostPeerId;
              clearLeadProbeTimers();
              state.isProbingLead = false;
              state.isWaitingForLead = false;
            }
            if (Array.isArray(committedPeers)) {
              committedPeers.forEach((cid) => {
                if (cid && cid !== state.myPeerId && state.peers.has(cid)) {
                  const cp = state.peers.get(cid);
                  if (!cp.commitHash) cp.commitHash = 'committed';
                }
              });
            }
            if (isRevealed && !state.isRevealed) {
              state.isRevealed = true;
              if (state.myVote !== null && state.mySalt) {
                broadcastToMesh({
                  type: 'VOTE_REVEALED',
                  payload: {
                    peerId: state.myPeerId,
                    value: state.myVote,
                    salt: state.mySalt
                  }
                });
              }
            }
            updateSelfInPeersMap();
            saveRoomState();
            renderRoomUI();
            break;
          }

          case 'SYNC_ME': {
            const pData = msg.payload || {};
            const peerId = pData.peerId || senderPeerId;
            if (!peerId || peerId === state.myPeerId) return;

            const existing = state.peers.get(peerId) || {};
            const shouldReplySync = !existing._syncedBack;

            const updatedPeer = {
              ...existing,
              peerId,
              name: pData.name || existing.name || 'Peer',
              isHost: Boolean(pData.isHost),
              isObserver: Boolean(pData.isObserver),
              commitHash: pData.commitHash ?? (existing.commitHash === 'committed' ? null : existing.commitHash) ?? null,
              revealedVote: pData.revealedVote !== undefined ? normalizeFibValue(pData.revealedVote) : (existing.revealedVote ?? null),
              revealedSalt: pData.revealedSalt ?? existing.revealedSalt ?? null,
              joinedAt: pData.joinedAt || existing.joinedAt || Date.now(),
              connected: true,
              isSelf: false,
              _syncedBack: true
            };

            if (pData.isHost) {
              state.hostPeerId = peerId;
              clearLeadProbeTimers();
              state.isProbingLead = false;
              state.isWaitingForLead = false;
            }

            if (pData.isRevealed && !state.isRevealed) {
              state.isRevealed = true;
              if (state.myVote !== null && state.mySalt) {
                sendToPeer(peerId, {
                  type: 'VOTE_REVEALED',
                  payload: {
                    peerId: state.myPeerId,
                    value: state.myVote,
                    salt: state.mySalt
                  }
                });
              }
            }

            if (updatedPeer.revealedVote !== null && updatedPeer.revealedSalt && updatedPeer.commitHash) {
              const expected = await computeCommitHash(updatedPeer.revealedVote, updatedPeer.revealedSalt);
              updatedPeer.verified = (expected === updatedPeer.commitHash);
            }

            state.peers.set(peerId, updatedPeer);
            updateSelfInPeersMap();
            saveRoomState();

            if (shouldReplySync) {
              sendToPeer(peerId, buildSyncRoomStateMessage());
              sendToPeer(peerId, buildSyncMeMessage());
            }

            renderRoomUI();
            break;
          }

          case 'VOTE_COMMITTED': {
            if (state.isRevealed) return;
            const { peerId, hash } = msg.payload || {};
            const targetId = peerId || senderPeerId;
            if (!targetId || targetId === state.myPeerId) return;

            const peer = state.peers.get(targetId);
            if (peer) {
              peer.commitHash = hash || null;
              peer.revealedVote = null;
              peer.revealedSalt = null;
              peer.verified = null;
              state.peers.set(targetId, peer);
              saveRoomState();
              renderRoomUI();
            }
            break;
          }

          case 'TRIGGER_REVEAL': {
            state.isRevealed = true;
            updateSelfInPeersMap();
            saveRoomState();

            if (state.myVote !== null && state.mySalt) {
              broadcastToMesh({
                type: 'VOTE_REVEALED',
                payload: {
                  peerId: state.myPeerId,
                  value: state.myVote,
                  salt: state.mySalt
                }
              });
            }
            renderRoomUI();
            break;
          }

          case 'VOTE_REVEALED': {
            const { peerId, value, salt } = msg.payload || {};
            const targetId = peerId || senderPeerId;
            if (!targetId || targetId === state.myPeerId) return;

            const peer = state.peers.get(targetId);
            if (!peer) return;

            const normalizedValue = normalizeFibValue(value);
            if (normalizedValue === null || !salt) return;

            const computedHash = await computeCommitHash(normalizedValue, salt);
            if (peer.commitHash && peer.commitHash !== 'committed' && computedHash === peer.commitHash) {
              peer.revealedVote = normalizedValue;
              peer.revealedSalt = salt;
              peer.verified = true;
            } else if (!peer.commitHash || peer.commitHash === 'committed') {
              peer.commitHash = computedHash;
              peer.revealedVote = normalizedValue;
              peer.revealedSalt = salt;
              peer.verified = true;
            } else {
              peer.verified = false;
            }
            state.peers.set(targetId, peer);
            saveRoomState();
            renderRoomUI();
            break;
          }

          case 'RESET_BOARD': {
            resetBoardLocal();
            break;
          }

          // Section 4.4: Mid-Session Host Transfer Under PeerJS Relay
          case 'SET_HOST': {
            const newHostId = (msg.payload && (msg.payload.newHostId || msg.payload.hostId)) || msg.hostId;
            if (!newHostId) return;
            state.hostPeerId = newHostId;
            clearLeadProbeTimers();
            state.isProbingLead = false;
            state.isWaitingForLead = false;
            state.peers.forEach((p, id) => {
              p.isHost = (id === newHostId);
            });
            updateSelfInPeersMap();
            saveRoomState();
            renderRoomUI();
            break;
          }

          case 'PEER_LEAVING': {
            const leavingId = (msg.payload && msg.payload.peerId) || senderPeerId;
            handlePeerLeft(leavingId);
            break;
          }
        }
      }

      // -------------------------------------------------------------------
      // 10. CEREMONY ACTIONS
      // -------------------------------------------------------------------
      async function selectCard(fibValue) {
        if (state.isRevealed || state.myIsObserver) return;

        if (state.myVote === fibValue) {
          state.myVote = null;
          state.mySalt = null;
          state.myCommitHash = null;
        } else {
          state.myVote = fibValue;
          state.mySalt = generateSaltHex();
          state.myCommitHash = await computeCommitHash(fibValue, state.mySalt);
        }

        updateSelfInPeersMap();
        saveRoomState();

        broadcastToMesh({
          type: 'VOTE_COMMITTED',
          payload: {
            peerId: state.myPeerId,
            hash: state.myCommitHash
          }
        });

        renderRoomUI();
      }

      function triggerRevealCards() {
        if (state.hostPeerId !== state.myPeerId) return;
        state.isRevealed = true;
        updateSelfInPeersMap();
        saveRoomState();

        broadcastToMesh({ type: 'TRIGGER_REVEAL' });

        if (state.myVote !== null && state.mySalt) {
          broadcastToMesh({
            type: 'VOTE_REVEALED',
            payload: {
              peerId: state.myPeerId,
              value: state.myVote,
              salt: state.mySalt
            }
          });
        }

        renderRoomUI();
      }

      function resetBoardLocal() {
        state.isRevealed = false;
        state.confettiFiredForRound = false;
        state.myVote = null;
        state.mySalt = null;
        state.myCommitHash = null;

        state.peers.forEach((p) => {
          p.commitHash = null;
          p.revealedVote = null;
          p.revealedSalt = null;
          p.verified = null;
        });

        updateSelfInPeersMap();
        saveRoomState();
        renderRoomUI();
      }

      function triggerResetBoard() {
        if (state.hostPeerId !== state.myPeerId) return;
        resetBoardLocal();
        broadcastToMesh({ type: 'RESET_BOARD' });
      }

      // Section 4.4: In-band host transfer over existing DataChannels
      function assignHostRole(targetPeerId) {
        const isCurrentLead = state.hostPeerId === state.myPeerId;
        const isLeadVacant = !state.hostPeerId || !state.peers.has(state.hostPeerId);
        if (!isCurrentLead && !isLeadVacant) return;

        state.hostPeerId = targetPeerId;
        clearLeadProbeTimers();
        state.isProbingLead = false;
        state.isWaitingForLead = false;

        state.peers.forEach((p, id) => {
          p.isHost = (id === targetPeerId);
        });
        updateSelfInPeersMap();
        saveRoomState();

        broadcastToMesh({
          type: 'SET_HOST',
          payload: {
            newHostId: targetPeerId
          }
        });

        renderRoomUI();
      }

      // -------------------------------------------------------------------
      // 11. NETWORK LIFECYCLE (Section 4.1 - 4.3)
      // -------------------------------------------------------------------
      function teardownNetworking() {
        clearLeadProbeTimers();
        state.isProbingLead = false;
        state.isWaitingForLead = false;

        if (state.myPeerId) {
          broadcastToMesh({
            type: 'PEER_LEAVING',
            payload: { peerId: state.myPeerId }
          });
        }

        state.dataChannels.forEach((conn) => {
          try { conn.close(); } catch (_) {}
        });
        state.dataChannels.clear();

        if (state.peerInstance) {
          try { state.peerInstance.destroy(); } catch (_) {}
          state.peerInstance = null;
        }

        state.peers.clear();
        state.myPeerId = '';
        state.hostPeerId = null;
      }

      function initPeerInstance(requestedId, isClaimingLead = false, reconnectPeers = []) {
        try {
          const peer = new Peer(requestedId, {
            host: '0.peerjs.com',
            port: 443,
            secure: true,
            debug: 0,
            config: {
              iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
              ]
            }
          });

          state.peerInstance = peer;

          peer.on('open', (id) => {
            state.myPeerId = id;
            if (isClaimingLead) {
              state.hostPeerId = id;
            }

            updateSelfInPeersMap();
            saveRoomState();
            renderRoomUI();

            if (isClaimingLead) {
              reconnectPeers.forEach((p) => {
                connectToPeerWithTieBreaker(p.id || p.peerId, p.name, true);
              });
            } else {
              // Step 1: Probe LEAD_PEER_ID upon joining
              probeLeadConnection(false);
            }
          });

          peer.on('connection', (conn) => {
            registerDataChannel(conn, false);
          });

          peer.on('disconnected', () => {
            try {
              if (!peer.destroyed) peer.reconnect();
            } catch (_) {}
          });

          peer.on('error', (err) => {
            // When probing LEAD_PEER_ID or dialing a cached peer that is no longer online,
            // PeerJS emits 'peer-unavailable' with message "Could not connect to peer <id>".
            if (err && err.type === 'peer-unavailable') {
              const match = err.message && err.message.match(/peer\s+([A-Za-z0-9_-]+)/i);
              const unavailablePeerId = match ? match[1] : null;
              const leadId = getLeadPeerId();

              if (unavailablePeerId && unavailablePeerId !== leadId) {
                const staleConn = state.dataChannels.get(unavailablePeerId);
                if (staleConn) {
                  state.dataChannels.delete(unavailablePeerId);
                  try { staleConn.close(); } catch (_) {}
                }
                if (state.peers.has(unavailablePeerId)) {
                  state.peers.delete(unavailablePeerId);
                  saveRoomState();
                  renderRoomUI();
                }
                return;
              }

              const failedProbe = state.dataChannels.get(leadId);
              if (failedProbe && !failedProbe.open) {
                state.dataChannels.delete(leadId);
                try { failedProbe.close(); } catch (_) {}
              }
              if (state.leadProbeTimeout) {
                clearTimeout(state.leadProbeTimeout);
                state.leadProbeTimeout = null;
              }
              state.isProbingLead = false;
              ensureLeadPolling();
              renderRoomUI();
              return;
            }

            // If claiming LEAD_PEER_ID failed because another peer just claimed it,
            // fall back to an ephemeral member ID and connect to the lead.
            if (isClaimingLead && err && err.type === 'unavailable-id') {
              try { peer.destroy(); } catch (_) {}
              state.peerInstance = null;
              state.peers.delete(state.myPeerId);
              state.hostPeerId = null;
              const fallbackMemberId = generateMemberPeerId();
              state.myPeerId = fallbackMemberId;
              updateSelfInPeersMap();
              saveRoomState();
              initPeerInstance(fallbackMemberId, false);
              return;
            }

            if (!state.myPeerId) {
              state.myPeerId = requestedId;
              state.isProbingLead = false;
              ensureLeadPolling();
              updateSelfInPeersMap();
              renderRoomUI();
            }
          });
        } catch (_) {
          state.myPeerId = requestedId;
          state.isProbingLead = false;
          ensureLeadPolling();
          updateSelfInPeersMap();
          renderRoomUI();
        }
      }

      function startMeshForRoom() {
        teardownNetworking();

        const savedRoom = loadRoomState(state.roomName);
        const cachedRemotePeers = [];
        if (savedRoom) {
          state.joinedAt = savedRoom.joinedAt || Date.now();
          state.isRevealed = Boolean(savedRoom.isRevealed);
          state.myVote = normalizeFibValue(savedRoom.myVote);
          state.mySalt = savedRoom.mySalt || null;
          state.myCommitHash = savedRoom.myCommitHash || null;
          if (typeof savedRoom.myIsObserver === 'boolean') {
            state.myIsObserver = savedRoom.myIsObserver;
          }
          if (Array.isArray(savedRoom.participants)) {
            savedRoom.participants.forEach((p) => {
              const pid = p && (p.peerId || p.id);
              if (pid) {
                state.peers.set(pid, {
                  peerId: pid,
                  name: p.name || 'Peer',
                  isHost: Boolean(p.isHost),
                  isObserver: Boolean(p.isObserver),
                  commitHash: p.commitHash || null,
                  revealedVote: normalizeFibValue(p.revealedVote),
                  revealedSalt: p.revealedSalt || null,
                  verified: p.verified ?? null,
                  joinedAt: p.joinedAt || Date.now(),
                  connected: false,
                  isSelf: false
                });
                cachedRemotePeers.push({ id: pid, name: p.name || 'Peer' });
              }
            });
          }
        } else {
          state.joinedAt = Date.now();
          state.isRevealed = false;
          state.myVote = null;
          state.mySalt = null;
          state.myCommitHash = null;
        }

        // If this tab was previously the Lead before a page refresh, re-bind as LEAD_PEER_ID
        if (savedRoom && savedRoom.wasLead) {
          const leadId = getLeadPeerId(state.roomName);
          state.myPeerId = leadId;
          state.hostPeerId = leadId;
          updateSelfInPeersMap();
          renderRoomUI();
          initPeerInstance(leadId, true, cachedRemotePeers);
          return;
        }

        // Section 4.2: Ephemeral Member Peer ID on initial join
        const memberPeerId = generateMemberPeerId(state.roomName);
        state.myPeerId = memberPeerId;
        updateSelfInPeersMap();
        renderRoomUI();

        initPeerInstance(memberPeerId, false);
      }

      // -------------------------------------------------------------------
      // 12. UI RENDERING
      // -------------------------------------------------------------------
      function renderDeckUI() {
        if (state.myIsObserver) {
          el.observerHandNotice.classList.remove('hidden');
          el.fibonacciDeck.classList.add('hidden');
          return;
        }

        el.observerHandNotice.classList.add('hidden');
        el.fibonacciDeck.classList.remove('hidden');

        el.fibonacciDeck.innerHTML = '';
        FIB_DECK.forEach((val) => {
          const isSelected = state.myVote === val;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.disabled = state.isRevealed;
          btn.className = [
            'hand-card shrink-0 w-[52px] sm:w-14 aspect-[5/7] rounded-lg flex flex-col items-center justify-between p-1.5 border select-none focus:outline-none',
            isSelected
              ? 'selected bg-env-blue text-white border-env-lightblue'
              : 'bg-[var(--bg-canvas)] text-[var(--text-primary)] border-[var(--border-subtle)] hover:border-env-blue dark:hover:border-env-lightblue',
            state.isRevealed ? 'opacity-45 cursor-not-allowed' : 'cursor-pointer'
          ].join(' ');

          btn.innerHTML = `
            <span class="font-mono text-[9px] self-start opacity-60 leading-none">${val}</span>
            <span class="font-display font-bold text-lg sm:text-xl tracking-tight leading-none">${val}</span>
            <span class="font-mono text-[9px] self-end opacity-60 leading-none rotate-180">${val}</span>
          `;

          btn.addEventListener('click', () => selectCard(val));
          el.fibonacciDeck.appendChild(btn);
        });
      }

      function renderDistributionUI(participants) {
        if (!state.isRevealed) {
          el.sectionDistribution.classList.add('hidden');
          el.sectionDistribution.classList.remove('flex');
          return;
        }

        const counts = new Map();
        FIB_DECK.forEach(v => counts.set(v, 0));

        let totalActiveNonNullVotes = 0;
        let committedCount = 0;
        let maxCount = 0;

        participants.forEach((p) => {
          if (p.isObserver) return;
          if (p.commitHash) committedCount++;
          if (p.revealedVote !== null && p.revealedVote !== undefined && counts.has(p.revealedVote)) {
            const nextCount = counts.get(p.revealedVote) + 1;
            counts.set(p.revealedVote, nextCount);
            if (nextCount > maxCount) maxCount = nextCount;
            totalActiveNonNullVotes++;
          }
        });

        el.distributionBars.innerHTML = '';

        if (totalActiveNonNullVotes === 0) {
          el.sectionDistribution.classList.add('hidden');
          el.sectionDistribution.classList.remove('flex');
          return;
        }

        // Trigger bottom-middle confetti once per round when everyone who voted agrees on the same points
        const distinctValues = Array.from(counts.values()).filter(c => c > 0).length;
        if (
          !state.confettiFiredForRound &&
          committedCount > 0 &&
          totalActiveNonNullVotes === committedCount &&
          distinctValues === 1
        ) {
          state.confettiFiredForRound = true;
          launchBottomMiddleConfetti();
        }

        el.sectionDistribution.classList.remove('hidden');
        el.sectionDistribution.classList.add('flex');

        FIB_DECK.forEach((cardVal) => {
          const count = counts.get(cardVal) || 0;
          if (count === 0) return;

          const heightPct = Math.max(12, Math.round((count / maxCount) * 100));

          const col = document.createElement('div');
          col.className = 'flex flex-col items-center gap-2';
          col.innerHTML = `
            <div class="w-8 h-28 rounded-lg bg-[var(--bg-surface)]/80 border border-[var(--border-subtle)] p-1 flex items-end justify-center overflow-hidden">
              <div class="dist-bar-fill w-full rounded-sm bg-env-blue dark:bg-env-lightblue" style="height: ${heightPct}%"></div>
            </div>
            <span class="font-display font-bold text-sm text-[var(--text-primary)] leading-none">${cardVal}</span>
          `;
          el.distributionBars.appendChild(col);
        });
      }

      function renderSidebarItem(p, amIHost) {
        const isLead = p.peerId === state.hostPeerId;
        const li = document.createElement('li');
        li.className = 'group flex items-center justify-between gap-2 px-2 py-1.5 rounded-lg hover:bg-[var(--bg-canvas)] transition-colors';

        let crownHtml = '';
        if (isLead) {
          crownHtml = `<span class="text-xs text-env-gold shrink-0" title="👑">👑</span>`;
        } else if (amIHost && !p.isSelf) {
          crownHtml = `
            <button
              type="button"
              data-make-lead="${escapeHtml(p.peerId)}"
              class="opacity-0 group-hover:opacity-45 hover:!opacity-100 focus:opacity-100 text-xs transition-opacity shrink-0"
              title="Pass 👑"
            >
              👑
            </button>
          `;
        }

        li.innerHTML = `
          <span class="truncate font-medium text-[var(--text-primary)]" title="${escapeHtml(p.name)}">
            ${escapeHtml(p.name)}
          </span>
          ${crownHtml}
        `;

        const makeLeadBtn = li.querySelector('[data-make-lead]');
        if (makeLeadBtn) {
          makeLeadBtn.addEventListener('click', () => assignHostRole(p.peerId));
        }

        return li;
      }

      function renderRoomUI() {
        if (!state.roomName) return;

        const participants = Array.from(state.peers.values()).sort((a, b) => {
          if (a.joinedAt !== b.joinedAt) return (a.joinedAt || 0) - (b.joinedAt || 0);
          return String(a.peerId).localeCompare(String(b.peerId));
        });

        const hostParticipant = state.hostPeerId ? state.peers.get(state.hostPeerId) : null;
        const isHostVacant = !hostParticipant;
        const amIHost = state.hostPeerId === state.myPeerId;

        el.headerMyName.textContent = state.myName;
        if (isHostVacant && (!state.isProbingLead || state.isWaitingForLead)) {
          el.vacantLeadBanner.classList.remove('hidden');
          if (el.waitLeadText) {
            el.waitLeadText.textContent = state.isWaitingForLead ? 'Waiting…' : 'Wait';
          }
          if (el.btnWaitLead) {
            el.btnWaitLead.disabled = state.isWaitingForLead;
            el.btnWaitLead.classList.toggle('opacity-60', state.isWaitingForLead);
          }
        } else {
          el.vacantLeadBanner.classList.add('hidden');
        }

        if (el.promptVacantLead) {
          if (isHostVacant && !state.isProbingLead && !state.isWaitingForLead) {
            el.promptVacantLead.classList.remove('hidden');
            el.promptVacantLead.classList.add('flex');
          } else {
            el.promptVacantLead.classList.add('hidden');
            el.promptVacantLead.classList.remove('flex');
          }
        }

        if (amIHost) {
          el.sectionHostControls.classList.remove('hidden');
          el.sectionHostControls.classList.add('flex');
          el.btnRevealCards.disabled = state.isRevealed;
          el.btnResetBoard.disabled = false;
        } else {
          el.sectionHostControls.classList.add('hidden');
          el.sectionHostControls.classList.remove('flex');
        }

        // Render Left Sidebar Lists: Voted, Waiting, Observer
        el.sidebarListVoted.innerHTML = '';
        el.sidebarListWaiting.innerHTML = '';
        el.sidebarListObserver.innerHTML = '';

        // Render Middle Area: Only participants who have voted
        el.participantsGrid.innerHTML = '';

        participants.forEach((p) => {
          const hasCommitted = Boolean(p.commitHash);

          if (p.isObserver) {
            el.sidebarListObserver.appendChild(renderSidebarItem(p, amIHost));
            return;
          }

          if (!hasCommitted) {
            el.sidebarListWaiting.appendChild(renderSidebarItem(p, amIHost));
            return;
          }

          // Participant has voted -> add to Voted sidebar list AND render card in middle area
          el.sidebarListVoted.appendChild(renderSidebarItem(p, amIHost));

          const isCardRevealed = state.isRevealed && p.revealedVote !== null && p.revealedVote !== undefined;
          const seatEl = document.createElement('div');
          seatEl.className = 'flex flex-col items-center w-24';

          seatEl.innerHTML = `
            <div class="w-16 h-24 card-perspective">
              <div class="card-inner ${isCardRevealed ? 'is-flipped' : ''}">
                <!-- Committed (Face-down) -->
                <div class="card-face rounded-xl card-back-engraved border border-env-lightblue/60 shadow-sm flex items-center justify-center text-white">
                  <span class="w-6 h-6 rounded-full bg-black/25 flex items-center justify-center text-xs font-mono">✔</span>
                </div>
                <!-- Revealed (Face-up) -->
                <div class="card-face card-face-back rounded-xl bg-[var(--bg-surface)] border-2 border-env-blue dark:border-env-lightblue shadow-md flex flex-col items-center justify-between p-1.5">
                  <span class="font-mono text-[9px] text-env-blue dark:text-env-lightblue self-start leading-none">${isCardRevealed ? p.revealedVote : ''}</span>
                  <span class="font-display font-extrabold text-2xl leading-none">${isCardRevealed ? p.revealedVote : ''}</span>
                  <span class="font-mono text-[9px] text-env-blue dark:text-env-lightblue self-end leading-none rotate-180">${isCardRevealed ? p.revealedVote : ''}</span>
                </div>
              </div>
            </div>
            <span class="mt-2 text-xs font-semibold truncate max-w-full" title="${escapeHtml(p.name)}">${escapeHtml(p.name)}</span>
          `;

          el.participantsGrid.appendChild(seatEl);
        });

        renderDeckUI();
        renderDistributionUI(participants);
      }

      // -------------------------------------------------------------------
      // 13. ROUTING & ONBOARDING (Sections 3.1 & 3.2)
      // -------------------------------------------------------------------
      function updateLobbyUrlPreview() {
        const slug = sanitizeRoomName(el.inputRoomSlug.value) || 'core-sprint-44';
        const base = window.location.href.split('#')[0];
        el.lobbyUrlPreviewText.textContent = `${base}#${slug}`;
      }

      function handleRouteChange() {
        const rawHash = window.location.hash.replace(/^#\/?/, '').trim();
        const sanitized = sanitizeRoomName(rawHash);

        if (!sanitized) {
          teardownNetworking();
          state.roomName = '';
          el.viewRoom.classList.add('hidden');
          el.viewLobby.classList.remove('hidden');
          el.headerRoomControls.classList.add('hidden');
          el.headerRoomControls.classList.remove('flex');
          el.btnEditProfile.classList.add('hidden');
          el.btnEditProfile.classList.remove('inline-flex');
          el.vacantLeadBanner.classList.add('hidden');
          el.modalOnboarding.classList.add('hidden');
          el.modalOnboarding.classList.remove('flex');

          if (!el.inputRoomSlug.value) {
            el.inputRoomSlug.value = generateRandomSlug();
          }
          updateLobbyUrlPreview();
          return;
        }

        if (rawHash !== sanitized) {
          history.replaceState(null, '', `#${sanitized}`);
        }

        state.roomName = sanitized;
        el.viewLobby.classList.add('hidden');
        el.viewRoom.classList.remove('hidden');
        el.headerRoomControls.classList.remove('hidden');
        el.headerRoomControls.classList.add('flex');
        el.btnEditProfile.classList.remove('hidden');
        el.btnEditProfile.classList.add('inline-flex');
        el.headerRoomName.textContent = sanitized;

        const savedRoom = loadRoomState(sanitized);
        state.myIsObserver = Boolean(savedRoom && savedRoom.myIsObserver);
        if (savedRoom && savedRoom.onboarded && (savedRoom.myName || state.myName)) {
          state.myName = state.myName || savedRoom.myName;
          state.isOnboarded = true;
          startMeshForRoom();
        } else {
          openOnboardingModal(false);
        }
      }

      function openOnboardingModal(allowClose = false) {
        el.modalRoomLabel.textContent = `#${state.roomName}`;
        el.inputDisplayName.value = state.myName || '';
        el.inputIsObserver.checked = Boolean(state.myIsObserver);
        if (allowClose) {
          el.btnCloseOnboarding.classList.remove('hidden');
        } else {
          el.btnCloseOnboarding.classList.add('hidden');
        }
        el.modalOnboarding.classList.remove('hidden');
        el.modalOnboarding.classList.add('flex');
        setTimeout(() => el.inputDisplayName.focus(), 50);
      }

      function closeOnboardingModal() {
        el.modalOnboarding.classList.add('hidden');
        el.modalOnboarding.classList.remove('flex');
      }

      async function copyTextToClipboard(text) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (_) {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          try {
            document.execCommand('copy');
            document.body.removeChild(ta);
            return true;
          } catch (_) {
            document.body.removeChild(ta);
            return false;
          }
        }
      }

      // -------------------------------------------------------------------
      // 14. EVENT LISTENERS
      // -------------------------------------------------------------------
      function bindEvents() {
        window.addEventListener('hashchange', handleRouteChange);

        const handleUnload = () => {
          if (state.myPeerId) {
            broadcastToMesh({
              type: 'PEER_LEAVING',
              payload: { peerId: state.myPeerId }
            });
          }
          if (state.peerInstance) {
            try { state.peerInstance.destroy(); } catch (_) {}
          }
        };

        window.addEventListener('beforeunload', handleUnload);
        window.addEventListener('pagehide', handleUnload);

        el.btnThemeToggle.addEventListener('click', toggleTheme);

        el.inputRoomSlug.addEventListener('input', updateLobbyUrlPreview);

        el.formCreateRoom.addEventListener('submit', (e) => {
          e.preventDefault();
          const slug = sanitizeRoomName(el.inputRoomSlug.value) || generateRandomSlug();
          window.location.hash = `#${slug}`;
        });

        el.btnInstantRoom.addEventListener('click', () => {
          const slug = generateRandomSlug();
          el.inputRoomSlug.value = slug;
          window.location.hash = `#${slug}`;
        });

        el.btnLobbyCopy.addEventListener('click', async () => {
          const slug = sanitizeRoomName(el.inputRoomSlug.value) || generateRandomSlug();
          el.inputRoomSlug.value = slug;
          updateLobbyUrlPreview();
          const fullUrl = `${window.location.href.split('#')[0]}#${slug}`;
          await copyTextToClipboard(fullUrl);
          el.lobbyCopyText.textContent = 'Copied';
          setTimeout(() => {
            el.lobbyCopyText.textContent = 'Copy Invite Link';
          }, 1800);
        });

        el.btnCopyLink.addEventListener('click', async () => {
          await copyTextToClipboard(window.location.href);
          el.copyLinkText.textContent = 'Copied';
          setTimeout(() => {
            el.copyLinkText.textContent = 'Copy Link';
          }, 1800);
        });

        el.formOnboarding.addEventListener('submit', (e) => {
          e.preventDefault();
          const name = el.inputDisplayName.value.trim() || 'Engineer';
          const isObserver = el.inputIsObserver.checked;

          state.myName = name;
          state.myIsObserver = isObserver;
          state.isOnboarded = true;

          localStorage.setItem(STORAGE_KEYS.NAME, name);

          if (isObserver) {
            state.myVote = null;
            state.mySalt = null;
            state.myCommitHash = null;
          }

          saveRoomState();
          closeOnboardingModal();

          if (!state.peerInstance && !state.myPeerId) {
            startMeshForRoom();
          } else {
            updateSelfInPeersMap();
            saveRoomState();
            broadcastToMesh(buildSyncMeMessage());
            renderRoomUI();
          }
        });

        el.btnCloseOnboarding.addEventListener('click', closeOnboardingModal);

        el.btnEditProfile.addEventListener('click', () => {
          openOnboardingModal(true);
        });

        el.btnSwitchToVoter.addEventListener('click', () => {
          state.myIsObserver = false;
          updateSelfInPeersMap();
          saveRoomState();
          broadcastToMesh(buildSyncMeMessage());
          renderRoomUI();
        });

        el.btnRevealCards.addEventListener('click', triggerRevealCards);
        el.btnResetBoard.addEventListener('click', triggerResetBoard);

        el.btnClaimLead.addEventListener('click', () => {
          claimLeadByBinding();
        });

        el.btnWaitLead.addEventListener('click', () => {
          startWaitingForLead();
        });

        if (el.btnCenterClaimLead) {
          el.btnCenterClaimLead.addEventListener('click', () => {
            claimLeadByBinding();
          });
        }

        if (el.btnCenterWaitLead) {
          el.btnCenterWaitLead.addEventListener('click', () => {
            startWaitingForLead();
          });
        }
      }

      initTheme();
      bindEvents();
      handleRouteChange();
    })();
  </script>
</body>
</html>
